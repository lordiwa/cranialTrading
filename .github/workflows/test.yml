name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vue-tsc --noEmit

  build:
    needs: [unit-tests, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # TASK-254: this condition and the E2E job's VITE_MODE condition below
      # must stay the SAME predicate (github.ref == main), not two conditions
      # that happen to agree on develop and main. They used to be complements
      # of DIFFERENT predicates (this one keyed on == develop, the E2E job's
      # on == main) — on a pull_request event github.ref is
      # refs/pull/<n>/merge, neither branch, so both fell through to their
      # "else": this job built PRODUCTION and the E2E job expected
      # development, which the TASK-254 guard correctly read as a mismatch
      # and aborted. Before the guard existed, that same fallthrough meant
      # every PR silently built prod and ran the FULL (mutating) E2E suite
      # against it — this ticket's incident, on a second path nobody had
      # looked at. Keying both on "is this main" — never inverted — fixes
      # that: PRs (and any other non-main ref) now build development, same
      # as develop; only main builds production, because the E2E job tests
      # the exact same dist artifact that deploy-prod then publishes.
      - name: Build (prod mode for main, dev mode for every other ref incl. PRs)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vite build
          else
            npx vite build --mode development
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── E2E tests (single job to share cached Firebase auth and avoid rate-limiting) ──
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
      TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create .env.local
        run: |
          echo "TEST_USER_A_EMAIL=${TEST_USER_A_EMAIL}" >> .env.local
          echo "TEST_USER_A_PASSWORD=${TEST_USER_A_PASSWORD}" >> .env.local
      - name: Validate test credentials
        run: |
          if [ -z "$TEST_USER_A_EMAIL" ] || [ -z "$TEST_USER_A_PASSWORD" ]; then
            echo "::error::Missing TEST_USER_A_EMAIL or TEST_USER_A_PASSWORD secrets"
            exit 1
          fi
      # TASK-240: admin credentials for E2E TEARDOWN (e2e/helpers/admin.ts).
      # The "add card" spec creates a real document in the shared dev account
      # and can only delete it by id, out of band — the created card often
      # never reaches card_index (TASK-234), so it is not on the grid and has
      # no delete button to click. Without these credentials that spec SKIPS
      # itself rather than leak; the skip is visible in the report.
      # Same dev service account deploy-dev already uses. Deliberately NOT
      # provided on main: main runs `--grep @smoke` against the production
      # bundle, this spec is not @smoke, and a dev-scoped admin must never be
      # in scope for a prod-configured run.
      - name: Provide admin credentials for E2E teardown (develop only)
        if: github.ref == 'refs/heads/develop'
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_DEV not set — mutating specs with admin teardown will skip"
            exit 0
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > "$RUNNER_TEMP/sa-dev.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa-dev.json" >> "$GITHUB_ENV"
      # develop runs the full suite against the dev project — that IS the gate.
      # main only ever fast-forwards an already-green develop, so re-running the
      # full suite there re-tests identical code; the one thing it would add is
      # exercising the production-configured bundle, and it pays for that by
      # running every mutating spec (card/deck/binder CRUD, password change,
      # account registration) against the PRODUCTION database — the same dist
      # artifact is both what e2e tests and what deploy-prod publishes, so the
      # e2e job cannot be pointed at dev without also shipping a dev-configured
      # bundle to prod. Smoke keeps the part worth having (the prod bundle boots
      # and can authenticate) without the destructive part.
      #
      # TASK-151: this guarantee only holds because @smoke is kept mutator-free
      # by convention, not by anything --grep enforces on its own — two specs
      # ("create new binder", "create new deck") were tagged @smoke and were
      # writing real documents to production on every push to main until this
      # ticket. Any test newly tagged @smoke MUST be read-only (no create/edit/
      # delete against Firestore); verify that before adding the tag.
      # TASK-254: VITE_MODE tells the local playwright.config.ts webServer
      # what to build in local/dev runs, and it is what the TASK-254 dist-vs-
      # project guard (e2e/verify-dist-env.global-setup.ts) reads to know
      # which Firebase project this run is SUPPOSED to be testing. It must be
      # set explicitly here, matching the same branch check the `build` job
      # already uses to decide --mode: on main the `build` job compiles
      # WITHOUT --mode (production, deliberately — see the comment above),
      # so the guard's expectation must say "production" too, or it aborts a
      # correct, intentional prod-bundle run and deploy-prod never fires.
      - name: Run E2E tests (full suite on develop, smoke only on main)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VITE_MODE=production npx playwright test --grep @smoke
          else
            VITE_MODE=development npx playwright test
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  # ── Deploy to Dev (gated on E2E tests) ──────────────────────────
  deploy-dev:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: cranial-trading-dev
          channelId: live

  # ── Deploy to Production (gated on the e2e job — @smoke subset only on main, see above) ──
  deploy-prod:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
